<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#161618" />
  <!-- Local ES modules + inline-SVG icons. The one external dependency is the
       EB Garamond / IBM Plex Mono webfont (to match td10.pw), allowed below. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>td10 Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M8 2h8l4 6-4 6H8L4 8z' fill='%23284b63'/%3E%3Cpath d='M12 5l1.6 3.2L17 8.6l-2.4 2.2.7 3.4L12 12.6 8.7 14.2l.7-3.4L7 8.6l3.4-.4z' fill='%2384a59d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" id="brand-mark"></span>
      <span class="name">td10 Atlas</span>
      <span class="sub">a WAG hex atlas for Tiny&nbsp;d10</span>
    </div>
    <label class="atlas-name">
      <input id="atlas-name" type="text" placeholder="Untitled atlas" spellcheck="false" />
    </label>
    <div class="conn" id="conn"><!-- connection status + buttons, filled by app.js --></div>
  </header>

  <main id="main">
    <aside class="tools" id="tools"><!-- tools + brushes, filled by app.js --></aside>

    <section class="mapwrap" id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"><!-- rendered by app.js --></svg>
      <div class="map-hud" id="map-hud"></div>
    </section>

    <aside class="inspector" id="inspector"><!-- selected hex, filled by app.js --></aside>
  </main>

  <input id="import-file" type="file" accept="application/json,.json" hidden />

  <script type="module" src="app.js"></script>
</body>
</html>
